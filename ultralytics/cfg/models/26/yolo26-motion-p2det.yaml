# YOLO26 motion model re-targeted for few-pixel airborne objects (AOT drones).
#
# Rationale (see MOTION_DETECTION.md analysis): AOT targets are ~6 px at native 2448x2048;
# 51% are <=8 px. The stock head detects at P3/P4/P5 (stride 8/16/32), so a median 6 px target
# is 0.75 px on the finest (P3) grid - below one cell. This config REALLOCATES the stride budget
# down one octave: Detect(P2, P3, P4) instead of Detect(P3, P4, P5). Stride-4 P2 puts a 6 px
# target at 1.5 px on-grid (resolvable). The stride-32 P5 head is dropped: the largest targets
# (~50 px) are still 3 px at stride-16, so P5 is dead capacity on this data.
#
# Motion is pixel-fused at P2 (stride 4) and P3 (stride 8) - the few-pixel scales where global
# attention dilutes the target peak - and cross-attended at P4 (stride 16) where it localizes
# well and dense K/V is cheap. Motion is injected at the same stride it is detected, so the
# high-SNR frame-diff signal reaches the head without being re-pooled first (the flaw in
# yolo26-motion-pixelp2, which injected at stride 4 but detected at stride 8).

nc: 1 # single "airborne object" class (was 80 - 80-way head is wasted capacity/noise here)
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ──────────────────────────────────────────────────────────────────────
# Motion stream configuration  (MotionDetectionModel reads this section)
# ──────────────────────────────────────────────────────────────────────
motion:
  channels: 3                    # motion diff input channels (3 for RGB absolute diff)
  dims: [32, 64, 128, 256, 256]  # MotionEncoder output channels at each stride (x2, x4, x8, x16, x32)
  inject_layers: [2, 4, 6]  # backbone layers to fuse motion after: P2/4 (layer 2), P3/8 (layer 4), P4/16 (layer 6)
  motion_feat_scales: [1, 2, 3]  # encoder stage feeding each inject point: x4, x8, x16
  fusion: [pixel, pixel, attn]
  # ^ pixel-aligned fusion at the two finest scales (P2/P3) preserves few-pixel target peaks;
  #   cross-attention at P4 localizes well and dense K/V is cheap there. sr only applies to attn.
  sr_ratios: [1, 1, 1]
  gate_init: 0.1

# ──────────────────────────────────────────────────────────────────────
# YOLO26 backbone  (current frame only – identical to yolo26.yaml)
# ──────────────────────────────────────────────────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2  ← MotionPixelFusion injected here (P2/4)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  ← MotionPixelFusion injected here (P3/8)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6  ← MotionCrossAttention injected here (P4/16)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# ──────────────────────────────────────────────────────────────────────
# Head  -  Detect(P2/4, P3/8, P4/16); the stride-32 P5 head is dropped.
# Top-down path descends to P2, then one bottom-up step rebuilds P3/P4.
# ──────────────────────────────────────────────────────────────────────
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11  P5->P4
  - [[-1, 6], 1, Concat, [1]] # 12  cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13  (P4 td)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14  P4->P3
  - [[-1, 4], 1, Concat, [1]] # 15  cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16  (P3 td)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17  P3->P2
  - [[-1, 2], 1, Concat, [1]] # 18  cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19  (P2/4-xsmall)  → Detect

  - [-1, 1, Conv, [128, 3, 2]] # 20  P2->P3
  - [[-1, 16], 1, Concat, [1]] # 21  cat head P3
  - [-1, 2, C3k2, [256, True]] # 22  (P3/8-small)   → Detect

  - [-1, 1, Conv, [256, 3, 2]] # 23  P3->P4
  - [[-1, 13], 1, Concat, [1]] # 24  cat head P4
  - [-1, 2, C3k2, [512, True]] # 25  (P4/16-medium) → Detect

  - [[19, 22, 25], 1, Detect, [nc]] # Detect(P2, P3, P4)
