# YOLO26 motion fusion study variant: motion->spatial attention map at P3 (pure 'look here' spotlight)
# Generated for the round-4 fusion-operator ablation; see run_ablation4.py.
#
# Attention-map analysis on a trained yolo26s-motion-p3sr (see analyze_attention.py and
# runs/attention_compare/) showed the motion encoder produces a target-specific peak at P3
# (specificity 1.60 on the diagnostic tile) that global cross-attention with 4x K/V pooling fails
# to route (residual specificity 1.00) - a few-pixel target occupies a fraction of one pooled K/V
# token. Pixel-aligned fusion (MotionPixelFusion) transmits that peak losslessly at O(N) cost, so
# it replaces cross-attention at P3. Cross-attention remains at P4/P5, where it demonstrably
# localizes motion points of interest (P4 target-query specificity 1.22) and where dense K/V is
# already cheap (1600 / 400 tokens at imgsz 640).
#
# Usage
# -----
#   from ultralytics.models.yolo.motion.train import MotionDetectionTrainer
#   trainer = MotionDetectionTrainer(overrides=dict(model="yolo26s-motion-hybrid.yaml", data="coco8.yaml"))
#   trainer.train()

nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26s-motion-p3sr.yaml' will call this file with scale 's'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ──────────────────────────────────────────────────────────────────────
# Motion stream configuration  (MotionDetectionModel reads this section)
# ──────────────────────────────────────────────────────────────────────
motion:
  channels: 3                    # motion diff input channels (3 for RGB absolute diff)
  dims: [32, 64, 128, 256, 256]  # MotionEncoder output channels at each stride (x2, x4, x8, x16, x32)
  inject_layers: [4, 6, 10]  # backbone layer indices to fuse motion after (P3, P4, P5+SPPF+C2PSA)
  motion_feat_scales: [2, 3, 4]
  fusion: [spatgate, attn, attn]
  # ^ pixel-aligned fusion at P3 (preserves few-pixel target peaks), cross-attention at P4/P5
  #   (localizes well at coarse scales; see header). sr_ratios only applies to "attn" points.
  sr_ratios: [1, 1, 1]
  gate_init: 0.1
  # ^ Initial per-block residual contribution is tanh(gate_init). Not 0: gradients into the whole
  #   motion pathway are scaled by tanh(gate), so a zero gate starves it at init (observed: gates
  #   stuck at |tanh| < 0.15 after 100 epochs). 0.1 stays near-identity but trains from step 1.
# ──────────────────────────────────────────────────────────────────────
# YOLO26 backbone  (current frame only – identical to yolo26.yaml)
# ──────────────────────────────────────────────────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  ← MotionCrossAttention injected here (P3, sr_ratio=4)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6  ← MotionCrossAttention injected here (P4)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10  ← MotionCrossAttention injected here (P5)

# ──────────────────────────────────────────────────────────────────────
# YOLO26 head  (identical to yolo26.yaml)
# ──────────────────────────────────────────────────────────────────────
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
